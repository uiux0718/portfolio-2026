<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>부산국제영화제 카드뉴스 | YEJI STUDIO</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="biff/viewer.css">
  <script src="biff/viewer.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="index.html#biff">작품 목록</a>
    <h1>부산국제영화제 카드뉴스</h1>
    <p>그린컴퓨터디자인학원 · 3인 팀 프로젝트<br>참여자 송현빈 · 이은진 · 김예지<br>김예지 담당 역할 · 기획·자료 조사 참여, 카드 디자인 아이디어 제안<br>주요 도구 Adobe Photoshop</p>
    <section aria-label="카드뉴스 보기" data-viewer>
      <div class="cards">
        <figure><img src="biff/01.webp" alt="표지" width="1080" height="1080"><figcaption>표지</figcaption></figure>
        <figure><img src="biff/02.webp" alt="부산국제영화제 소개" width="1080" height="1080" loading="lazy"><figcaption>부산국제영화제 소개</figcaption></figure>
        <figure><img src="biff/03.webp" alt="수상작 디파티드" width="1080" height="1080" loading="lazy"><figcaption>수상작 디파티드</figcaption></figure>
        <figure><img src="biff/04.webp" alt="화제작 어리석은 자는 누구인가" width="1080" height="1080" loading="lazy"><figcaption>화제작 어리석은 자는 누구인가</figcaption></figure>
        <figure><img src="biff/05.webp" alt="기대작 세 편" width="1080" height="1080" loading="lazy"><figcaption>기대작 세 편</figcaption></figure>
        <figure><img src="biff/06.webp" alt="올해의 감독상 박찬욱" width="1080" height="1080" loading="lazy"><figcaption>올해의 감독상 박찬욱</figcaption></figure>
        <figure><img src="biff/07.webp" alt="한정판 굿즈" width="1080" height="1080" loading="lazy"><figcaption>한정판 굿즈</figcaption></figure>
        <figure><img src="biff/08.webp" alt="마무리" width="1080" height="1080" loading="lazy"><figcaption>마무리</figcaption></figure>
      </div>
      <nav aria-label="카드뉴스 페이지" hidden>
        <button type="button" data-step="-1">이전</button>
        <span role="status" aria-atomic="true"></span>
        <button type="button" data-step="1">다음</button>
      </nav>
    </section>
  </main>
</body>
</html>
