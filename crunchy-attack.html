<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUNCHY ATTACK 랜딩페이지 | YEJI STUDIO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #141414; color: #fff; font-family: system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 20px; max-width: 1200px; margin: auto; padding: 12px 20px; }
    a { color: inherit; display: inline-flex; align-items: center; min-height: 44px; text-underline-offset: 4px; }
    h1 { font-size: 14px; font-weight: 600; margin: 0; }
    main { width: min(100% - 32px, 1100px); margin: 12px auto 48px; }
    main[data-view="overview"] { width: min(100% - 32px, calc((100svh - 220px) * 1600 / 7644)); }
    .view-controls { display: flex; gap: 8px; }
    button { min-height: 44px; padding: 8px 14px; border: 1px solid #666; border-radius: 6px; background: #242424; color: #fff; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #ffcf00; color: #141414; border-color: #ffcf00; }
    @media (max-width: 600px) { header { gap: 8px; } h1 { width: 100%; order: -1; } main { width: calc(100% - 16px); } }
    img { display: block; width: 100%; height: auto; }
    a:focus-visible { outline: 2px solid #ffcf00; outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html#crunch">작품 목록</a>
    <h1>CRUNCHY ATTACK 랜딩페이지</h1>
    <div class="view-controls" aria-label="화면 보기 방식">
      <button type="button" data-view="overview" aria-pressed="true">전체 한눈에</button>
      <button type="button" data-view="detail" aria-pressed="false">크게 펼쳐 보기</button>
    </div>
  </header>
  <main data-view="overview" aria-label="크런키 랜딩페이지 원본 디자인">
    <img src="crunchy/original-landing.jpg" alt="크런키 학교 응원 캠페인 랜딩페이지. 트럭 프로모션, 학교별 응원 순위, 참여 혜택, 참여 방법, 학교 검색과 이벤트 일정." width="1600" height="7644" fetchpriority="high">
  </main>
  <script>
    const landing = document.querySelector('main');
    const controls = document.querySelectorAll('button[data-view]');
    controls.forEach(button => button.addEventListener('click', () => {
      landing.dataset.view = button.dataset.view;
      controls.forEach(control => control.setAttribute('aria-pressed', String(control === button)));
    }));
  </script>
</body>
</html>
